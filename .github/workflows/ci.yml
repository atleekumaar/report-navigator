name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python-test:
    name: Python Lint & Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8 pytest

      - name: Generate Synthetic Report Fixture
        run: |
          python create_sample_report.py

      - name: Python Syntax & Flake8 Check
        run: |
          # Stop build if there are Python syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics --exclude=venv,.venv,web

      - name: Run Pytest Suite
        run: |
          pytest -v

  web-check:
    name: Web Lint, Type-Check & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install Web Dependencies
        working-directory: web
        run: npm ci

      - name: Run Next.js Linter
        working-directory: web
        run: npm run lint

      - name: Run TypeScript Type Check
        working-directory: web
        run: npx tsc --noEmit

      - name: Build Next.js Web App
        working-directory: web
        run: npm run build
